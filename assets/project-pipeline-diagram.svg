<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" rx="32" fill="#F5F7FB"/>
  <rect x="60" y="56" width="1080" height="408" rx="28" fill="white" stroke="#E4E7EC"/>
  <text x="100" y="112" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Career Pipeline Project Flow</text>
  <text x="100" y="146" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Streamlit frontend connects with FastAPI APIs, JWT authentication, SQLAlchemy ORM, and SQLite database.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="205" width="160" height="120" rx="20" fill="#EEF2FF" stroke="#C7D2FE"/>
    <circle cx="136" cy="246" r="20" fill="#4F46E5"/>
    <text x="129" y="253" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">1</text>
    <text x="120" y="286" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Streamlit UI</text>
    <text x="120" y="310" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Login, dashboard, CRUD forms</text>
  </g>

  <path d="M270 265H345" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="205" width="160" height="120" rx="20" fill="#ECFDF3" stroke="#BBF7D0"/>
    <circle cx="396" cy="246" r="20" fill="#12B76A"/>
    <text x="389" y="253" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">2</text>
    <text x="380" y="286" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">FastAPI</text>
    <text x="380" y="310" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Routes and endpoints</text>
  </g>

  <path d="M530 265H605" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="620" y="205" width="160" height="120" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
    <circle cx="656" cy="246" r="20" fill="#2E90FA"/>
    <text x="649" y="253" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">3</text>
    <text x="640" y="286" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">JWT Auth</text>
    <text x="640" y="310" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Bearer token protection</text>
  </g>

  <path d="M790 265H865" stroke="#98A2B3" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="880" y="205" width="160" height="120" rx="20" fill="#FFF7ED" stroke="#FED7AA"/>
    <circle cx="916" cy="246" r="20" fill="#F79009"/>
    <text x="909" y="253" fill="white" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">4</text>
    <text x="900" y="286" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">SQLAlchemy</text>
    <text x="900" y="310" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">ORM models and sessions</text>
  </g>

  <path d="M960 335V372C960 388 947 401 931 401H704" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="350" width="280" height="78" rx="18" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="462" y="384" fill="#172033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">SQLite Database</text>
    <text x="462" y="407" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Users and job applications are</text>
    <text x="462" y="423" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">stored locally</text>
  </g>

  <rect x="100" y="170" width="940" height="1" fill="#EEF2F6"/>
  <text x="100" y="386" fill="#4F46E5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CRUD Loop</text>
  <text x="100" y="409" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Create, read, update, and delete</text>
  <text x="100" y="428" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">job applications through protected APIs.</text>
</svg>
